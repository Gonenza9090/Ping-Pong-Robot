# Copy to config.local.toml. Local settings are ignored by Git.
[camera]
source = "http://127.0.0.1:8080/video"
connect_timeout_s = 3.0
read_timeout_s = 3.0
stale_after_s = 1.0
reconnect_delay_s = 0.5

[calibration]
# Stream resolution confirmed by the author: 1920 x 1080.
# The original 1390 px setting is retained as an UNVERIFIED starting value.
# Its old comments mention 1600 x 900. Recalibrate at the resolution below
# before relying on distance results; no automatic focal-length scaling is applied.
focal_length_px = 1390.0
frame_width = 1920
frame_height = 1080

[measurement]
backend = "grabcut"
samples = 5
jitter_px = 4
edge_margin_px = 15
width_correction = false
ratio_tolerance_pct = 20.0
sam_weights = "models/mobile_sam.pt"

[[objects]]
key = "1"
name = "Fogg can"
height_cm = 17.5
# Widths copied from original Dis_measure.py lines 84-88.
# Set width_verified = true only after confirming physical measurements.
width_cm = 4.4
width_verified = false

[[objects]]
key = "2"
name = "Box"
height_cm = 18.8
width_cm = 10.0
width_verified = false

[[objects]]
key = "3"
name = "Can 2"
height_cm = 12.0
width_cm = 3.5
width_verified = false
