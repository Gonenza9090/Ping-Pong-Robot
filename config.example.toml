# Copy to config.local.toml. Local settings are ignored by Git.
[camera]
source = "http://127.0.0.1:8080/video"
connect_timeout_s = 3.0
read_timeout_s = 3.0
stale_after_s = 1.0
reconnect_delay_s = 0.5

[calibration]
# Starting values from the original prototype, NOT a new validated calibration.
# Measurements require this exact frame resolution and the same camera/phone zoom.
focal_length_px = 1390.0
frame_width = 1600
frame_height = 900

[measurement]
backend = "grabcut"
samples = 5
jitter_px = 4
edge_margin_px = 15
width_correction = false
ratio_tolerance_pct = 20.0
sam_weights = "models/mobile_sam.pt"

[[objects]]
key = "1"
name = "Fogg can"
height_cm = 17.5
# width_cm is intentionally absent: the original widths were not confirmed.
# Set width_cm and width_verified = true only after physically measuring it.

[[objects]]
key = "2"
name = "Box"
height_cm = 18.8

[[objects]]
key = "3"
name = "Can 2"
height_cm = 12.0
